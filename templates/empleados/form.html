{% extends 'layout.html' %}
{% block title %}{{ 'Editar' if emp else 'Nuevo' }} empleado{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ 'Editar' if emp else 'Nuevo' }} empleado</h1>
<div class="card shadow-sm"><div class="card-body">
  <form method="POST" action="{{ url_for('empleados.editar', id=emp.id) if emp else url_for('empleados.nuevo') }}">
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Cédula</label>
        <input type="text" name="cedula" class="form-control" maxlength="10" pattern="\d{10}" title="10 dígitos" required value="{{ emp.cedula if emp else '' }}">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Nombres</label>
        <input type="text" name="nombres" class="form-control" maxlength="100" required value="{{ emp.nombres if emp else '' }}">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Apellidos</label>
        <input type="text" name="apellidos" class="form-control" maxlength="100" required value="{{ emp.apellidos if emp else '' }}">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" maxlength="120" value="{{ emp.email or '' if emp else '' }}">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Teléfono</label>
        <input type="text" name="telefono" class="form-control" maxlength="20" value="{{ emp.telefono or '' if emp else '' }}">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Fecha de ingreso</label>
        <input type="date" name="fecha_ingreso" class="form-control" required value="{{ emp.fecha_ingreso if emp else '' }}">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Departamento</label>
        <select name="departamento_id" class="form-select" required>
          <option value="">Seleccione...</option>
          {% for d in departamentos %}<option value="{{ d.id }}" {{ 'selected' if emp and emp.departamento_id == d.id }}>{{ d.nombre }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Cargo</label>
        <select name="cargo_id" class="form-select" required>
          <option value="">Seleccione...</option>
          {% for c in cargos %}<option value="{{ c.id }}" {{ 'selected' if emp and emp.cargo_id == c.id }}>{{ c.nombre }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Horario</label>
        <select name="horario_id" class="form-select" required>
          <option value="">Seleccione...</option>
          {% for h in horarios %}<option value="{{ h.id }}" {{ 'selected' if emp and emp.horario_id == h.id }}>{{ h.nombre }} ({{ h.hora_entrada }} - {{ h.hora_salida }})</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">PIN {{ '(vacío = no cambiar)' if emp }}</label>
        <input type="password" name="pin" class="form-control" minlength="4" maxlength="8" inputmode="numeric" pattern="\d{4,8}" title="4 a 8 dígitos" {{ '' if emp else 'required' }}>
        <div class="form-text">4 a 8 dígitos. Se guarda cifrado.</div>
      </div>
      <div class="col-md-4 mb-3 d-flex align-items-center">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="activo" id="activo" value="1" {{ 'checked' if (not emp or emp.activo) }}>
          <label class="form-check-label" for="activo">Activo</label>
        </div>
      </div>
    </div>
    <button class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('empleados.index') }}" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</div></div>
{% endblock %}
