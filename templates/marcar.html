{% extends 'layout.html' %}
{% set hide_navbar = true %}
{% block title %}Marcador{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4 text-center">
        <img src="{{ url_for('static', filename='img/logo.png') }}?v=2" alt="Logo CAE" class="img-fluid mb-2 rounded" style="max-height: 100px;">
        <h1 class="h4">Marcador de asistencia</h1>
        <p class="display-6" id="reloj">--:--:--</p>
        <p class="text-muted small">La hora oficial la registra el servidor.</p>
        <form action="{{ url_for('marcador.marcar') }}" method="POST" class="text-start">
          <div class="mb-3">
            <label class="form-label">Cédula</label>
            <input type="text" name="cedula" class="form-control" maxlength="10" inputmode="numeric" pattern="\d{10}" title="10 dígitos" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">PIN</label>
            <input type="password" name="pin" class="form-control" inputmode="numeric" required>
          </div>
          <div class="d-grid gap-2 d-md-flex">
            <button name="tipo" value="entrada" class="btn btn-success flex-fill">Entrada</button>
            <button name="tipo" value="salida" class="btn btn-danger flex-fill">Salida</button>
          </div>
        </form>
        {% if not session.get('user_id') %}
        <hr><a href="{{ url_for('auth.login') }}" class="small">Acceso administrador</a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
<script>
  // Reloj solo visual; el servidor es quien registra la hora real.
  const r = document.getElementById('reloj');
  setInterval(() => r.textContent = new Date().toLocaleTimeString('es-EC', {hour12:false}), 1000);
</script>
{% endblock %}
