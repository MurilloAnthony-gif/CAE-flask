{% extends "layout.html" %}
{% block titulo %}Editar Departamento - CAE{% endblock %}
{% block contenido %}
<h2>Editar Departamento #{{ departamento.id }}</h2>

<!-- Campos esperados por POST /departamentos/editar/<id>: nombre, descripcion, activo -->
<form method="POST" action="{{ url_for('departamentos.editar', id=departamento.id) }}">
    <p>Nombre: <input type="text" name="nombre" value="{{ departamento.nombre }}" required></p>
    <p>Descripción: <input type="text" name="descripcion" value="{{ departamento.descripcion or '' }}"></p>
    <p>
        <label>
            <input type="checkbox" name="activo" value="1" {% if departamento.activo %}checked{% endif %}>
            Activo
        </label>
    </p>
    <button type="submit">Actualizar</button>
    <a href="{{ url_for('departamentos.index') }}">Cancelar</a>
</form>
{% endblock %}
