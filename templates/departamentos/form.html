{% extends 'layout.html' %}
{% block title %}{{ 'Editar' if dep else 'Nuevo' }} departamento{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ 'Editar' if dep else 'Nuevo' }} departamento</h1>
<div class="card shadow-sm form-card"><div class="card-body">
  <form method="POST" action="{{ url_for('departamentos.editar', id=dep.id) if dep else url_for('departamentos.nuevo') }}">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" name="nombre" class="form-control" maxlength="100" required value="{{ dep.nombre if dep else '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <input type="text" name="descripcion" class="form-control" maxlength="255" value="{{ dep.descripcion or '' if dep else '' }}">
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="activo" id="activo" value="1" {{ 'checked' if (not dep or dep.activo) }}>
      <label class="form-check-label" for="activo">Activo</label>
    </div>
    <button class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('departamentos.index') }}" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</div></div>
{% endblock %}
