{% extends 'layout.html' %}
{% set hide_navbar = true %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4 text-center">
        <img src="{{ url_for('static', filename='img/logo.png') }}?v=2" alt="Logo CAE" class="img-fluid mb-3 rounded" style="max-height: 120px;">
        <h1 class="h4 mb-1">Control de Asistencia</h1>
        <p class="text-muted mb-4">Acceso de administrador</p>
        <form action="{{ url_for('auth.login') }}" method="POST" class="text-start">
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button class="btn btn-primary w-100">Ingresar</button>
        </form>
        <hr>
        <a href="{{ url_for('marcador.marcar') }}" class="btn btn-outline-secondary w-100">Ir al marcador de asistencia</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
